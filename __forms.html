<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Netlify Forms Registry</title>
</head>
<body>
  <!-- Netlify Form Definition: Custom Report Requests -->
  <form name="custom-report-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="custom-report-request">
    <input type="hidden" name="subject" value="New Custom Template Request - Reconciliation Automation">
    <input type="hidden" name="recipient" value="shubham.s.kadam8@gmail.com">
    <input type="text" name="bot-field">
    <input type="text" name="companyName">
    <input type="text" name="contactName">
    <input type="email" name="email">
    <input type="text" name="phone">
    <input type="text" name="erpSystem">
    <textarea name="requirements"></textarea>
  </form>

  <!-- Netlify Form Definition: Enterprise Consulting Leads -->
  <form name="consulting-lead" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="consulting-lead">
    <input type="hidden" name="subject" value="New Business Consulting Lead - Reconciliation Automation">
    <input type="hidden" name="recipient" value="shubham.s.kadam8@gmail.com">
    <input type="text" name="bot-field">
    <input type="text" name="fullName">
    <input type="text" name="company">
    <input type="email" name="email">
    <input type="text" name="phone">
    <input type="text" name="businessSize">
    <input type="text" name="serviceType">
    <textarea name="message"></textarea>
    <input type="checkbox" name="callbackRequested">
  </form>
</body>
</html>
